# Local Grafana + Prometheus stack — builds/proves the 10 KPI dashboards without the VPS.
# Same metrics + same generator as the vcvm deployment; portable.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: lrn-local-prometheus
    ports: ["9490:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana-oss:latest
    container_name: lrn-local-grafana
    ports: ["3300:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
